name: Build and test Caddy with MIB

permissions:
  contents: read
  pull-requests: write
  
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test Caddy MIB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y wget git build-essential

      # The Go version comes from go.mod, so a dependency bump that raises the
      # `go` directive does not fail on a hardcoded version check.
      - name: Install Go (version from go.mod)
        uses: actions/setup-go@v4
        with:
          go-version-file: go.mod

      - name: Show Go version
        run: go version

      # Build what was checked out. This job used to `git clone` main from
      # GitHub and build that copy, so on a pull request it never compiled the
      # pull request's code. `go mod download` instead of `go mod tidy` + `go get`,
      # which rewrote go.mod in CI and hid drift instead of catching it.
      - name: Install Go Dependencies
        run: go mod download

      - name: Build Caddy with caddy-mib
        run: |
          go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest
          xcaddy build --with github.com/fabriziosalmi/caddy-mib=./

      - name: Validate Build
        run: |
          if [ ! -f "caddy" ]; then
            echo "Caddy build failed"
            exit 1
          fi
          
      - name: Test Caddy Run and Validate MIB Provisioning
        run: |
          chmod +x caddy
          ./caddy run > caddy_output.log 2>&1 &
          sleep 5
          
          if ! pgrep -f "caddy run"; then
            echo "Caddy run failed"
            cat caddy_output.log
            exit 1
          fi
          
          if ! grep -q "caddy mib middleware provisioned" caddy_output.log; then
            echo "ADF provisioning log not found"
            cat caddy_output.log
            exit 1
          fi
          
          echo "Caddy build and run successful with MIB middleware provisioned"

      - name: Clean Up
        if: always()
        run: |
          pkill -f "caddy run" || true
          echo "Cleaned up running Caddy instances"
